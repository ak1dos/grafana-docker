events {}
http {
  access_log off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    client_max_body_size 16m;
    auth_basic "homelab ingestion";
    auth_basic_user_file /tmp/ingest.htpasswd;
    location = /api/v1/write {
      limit_except POST { deny all; }
      set $prometheus_upstream prometheus:9090;
      proxy_pass http://$prometheus_upstream$request_uri;
      proxy_set_header Authorization "";
    }
    location = /loki/api/v1/push {
      limit_except POST { deny all; }
      set $loki_upstream loki:3100;
      proxy_pass http://$loki_upstream$request_uri;
      proxy_set_header Authorization "";
    }
    location / { return 404; }
  }
}

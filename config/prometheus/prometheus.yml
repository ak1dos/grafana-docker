global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
        labels: {host: fujiserver}
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
        labels: {host: fujiserver}

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

name: homelab-telemetry
services:
  alloy:
    image: grafana/alloy:v1.19.2
    network_mode: host
    pid: host
    privileged: true
    user: root
    command: ["run", "--server.http.listen-addr=127.0.0.1:12345", "--storage.path=/var/lib/alloy", "/etc/alloy/config.alloy"]
    env_file: ../runtime/agent.env
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - type: bind
        source: /srv/homelab-monitoring/alloy
        target: /var/lib/alloy
        bind: {create_host_path: false}
      - /:/host:ro,rslave
      - /:/rootfs:ro,rslave
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /dev/disk:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    restart: unless-stopped
    mem_limit: 384m
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

name: homelab-monitoring
services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:?set PROMETHEUS_IMAGE in .env}
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d", "--storage.tsdb.retention.size=8GB", "--web.enable-remote-write-receiver"]
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - type: bind
        source: /srv/homelab-monitoring/prometheus
        target: /prometheus
        bind: {create_host_path: false}
    restart: unless-stopped
    mem_limit: 1g
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  alertmanager:
    image: ${ALERTMANAGER_IMAGE:?set ALERTMANAGER_IMAGE in .env}
    user: "1000:1000"
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager", "--cluster.listen-address="]
    volumes:
      - ./runtime/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - type: bind
        source: /srv/homelab-monitoring/alertmanager
        target: /alertmanager
        bind: {create_host_path: false}
    networks: [default, mail]
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *logging
  loki:
    depends_on:
      rustfs: {condition: service_healthy}
    image: ${LOKI_IMAGE:?set LOKI_IMAGE in .env}
    command: ["-config.file=/etc/loki/loki.yml", "-config.expand-env=true"]
    env_file: ./runtime/loki.env
    volumes:
      - ./config/loki:/etc/loki:ro
      - type: bind
        source: /srv/homelab-monitoring/loki
        target: /loki
        bind: {create_host_path: false}
    restart: unless-stopped
    mem_limit: 1g
    logging: *logging
  grafana:
    image: ${GRAFANA_IMAGE:?set GRAFANA_IMAGE in .env}
    ports: ["192.168.1.54:13000:3000"]
    env_file: ./runtime/grafana.env
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - type: bind
        source: /srv/homelab-monitoring/grafana
        target: /var/lib/grafana
        bind: {create_host_path: false}
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    mem_limit: 1g
    logging: *logging
  gateway:
    image: ${NGINX_IMAGE:?set NGINX_IMAGE in .env}
    command: ["/bin/sh", "-ec", "cp /run/secrets/ingest.htpasswd /tmp/ingest.htpasswd; cp /run/secrets/goose.htpasswd /tmp/goose.htpasswd; chmod 644 /tmp/ingest.htpasswd /tmp/goose.htpasswd; exec nginx -g 'daemon off;'"]
    ports: ["${MONITORING_BIND_IP:?set WireGuard address}:3100:8080"]
    volumes:
      - ./config/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./runtime/ingest.htpasswd:/run/secrets/ingest.htpasswd:ro
      - ./runtime/goose.htpasswd:/run/secrets/goose.htpasswd:ro
    depends_on: [prometheus, loki]
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging
# Fuji owns the backend, storage and local collector in one Compose project.
  rustfs:
    image: ${RUSTFS_IMAGE:?set RUSTFS_IMAGE in .env}
    entrypoint: ["/bin/sh", "/bootstrap/start-rustfs.sh"]
    env_file: ./runtime/rustfs.env
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: warn
      RUSTFS_OBS_LOG_DIRECTORY: /logs
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:9001:9001"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./storage/start-rustfs.sh:/bootstrap/start-rustfs.sh:ro
      - type: bind
        source: /tank/observability
        target: /das
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /tank/observability/rustfs/data
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: /tank/observability/rustfs/logs
        target: /logs
        bind: {create_host_path: false}
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *logging
  init:
    image: ${MC_IMAGE:?set MC_IMAGE in .env}
    profiles: [bootstrap]
    env_file: [./runtime/rustfs.env, ./runtime/loki.env]
    entrypoint: [/bin/sh, /bootstrap/init.sh]
    volumes:
      - ./storage/init.sh:/bootstrap/init.sh:ro
      - ./storage/loki-policy.json:/bootstrap/loki-policy.json:ro
    restart: "no"
  alloy:
    image: ${ALLOY_IMAGE:?set ALLOY_IMAGE in .env}
    network_mode: host
    pid: host
    privileged: true
    user: root
    command: ["run", "--server.http.listen-addr=127.0.0.1:12345", "--storage.path=/var/lib/alloy", "/etc/alloy/config.alloy"]
    env_file: ./runtime/agent.env
    volumes:
      - ./agents/config.alloy:/etc/alloy/config.alloy:ro
      - type: bind
        source: /srv/homelab-monitoring/alloy
        target: /var/lib/alloy
        bind: {create_host_path: false}
      - /:/host:ro,rslave
      - /:/rootfs:ro,rslave
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /dev/disk:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    restart: unless-stopped
    mem_limit: 1g
    logging: *logging

networks:
  default: {}
  mail:
    external: true
    name: homelab-mail
